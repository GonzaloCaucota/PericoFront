name: taxi-compartido-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: perico_db
      POSTGRES_USER: taxi_local
      POSTGRES_PASSWORD: taxi_local_password
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi_local -d perico_db"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.19
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin_local_password
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "127.0.0.1:${PGADMIN_LOCAL_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Base descartable independiente para npm run test:db:local.
  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: taxi_integration
      POSTGRES_USER: taxi_local
      POSTGRES_PASSWORD: taxi_local_password
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55439}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi_local -d taxi_integration"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: "no"

volumes:
  postgres_data:
  pgadmin_data:
